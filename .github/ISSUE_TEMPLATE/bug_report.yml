name: Bug report
description: Something is broken in CosDI runtime, diagnostics, or the extension
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CosDI. Fill this in so we can reproduce the issue.
  - type: input
    id: creator-version
    attributes:
      label: Cocos Creator version
      placeholder: "3.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: cosdi-version
    attributes:
      label: CosDI version
      description: Extension version, npm version, or git commit
      placeholder: "1.0.0"
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      placeholder: Short description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Editor console, PreviewInEditor output, or a screenshot
    validations:
      required: false
