name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to a branch makes the run before it moot.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every suite, on the platforms and Node versions a Cocos Creator project is
  # opened and built on. Linux covers the range, the others cover themselves.
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 18 }
          - { os: ubuntu-latest, node: 20 }
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: ubuntu-latest, node: 26 }
          - { os: windows-latest, node: 20 }
          - { os: windows-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Run every suite
        run: npm test

  # Creator brings its own TypeScript, so the runtime and everything generated
  # for it has to compile on more than the one version pinned here.
  typescript:
    name: typescript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typescript: ['4.7', '4.9', '5.4', 'latest']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Use TypeScript ${{ matrix.typescript }}
        run: npm install --no-save typescript@${{ matrix.typescript }}

      - name: Run every suite
        run: npm test

  pack:
    name: pack
    needs: [test, typescript]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Generate interface tokens
        run: npm run tokens

      - name: Pack cosdi
        working-directory: assets/CosDI
        run: npm pack --dry-run

      - name: Pack cosdi-diagnostics
        working-directory: extensions/cosdi-diagnostics
        run: npm pack --dry-run --ignore-scripts

      - name: Pack cosdi-codegen
        working-directory: extensions/cosdi-codegen
        run: npm pack --dry-run --ignore-scripts

      - name: Pack extension zip
        run: node scripts/pack-extension.js
      - name: Check zip
        run: |
          test -f cosdi-diagnostics.zip
          unzip -l cosdi-diagnostics.zip | grep -q package.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosdi-diagnostics.zip
          path: cosdi-diagnostics.zip
