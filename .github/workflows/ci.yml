name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dev dependencies
        run: npm ci

      - name: Check versions are in sync
        run: node scripts/check-versions.js

      - name: Runtime tests
        run: node scripts/test-runtime.js

      - name: Registration validation tests
        run: node scripts/test-validation.js

      - name: Circular dependency tests
        run: node scripts/test-circular.js

      - name: Dependency graph tests
        run: node scripts/test-graph.js

      - name: Error diagnostics tests
        run: node scripts/test-errors.js

      - name: Token codegen tests
        run: node scripts/test-token-codegen.js

      - name: DI analyzer tests
        run: node scripts/test-di-analyzer.js

      - name: Validate CLI and build hook tests
        run: node scripts/test-validate-cli.js

      - name: Generate interface tokens
        run: node scripts/generate-tokens.js

      - name: Pack cosdi
        working-directory: assets/CosDI
        run: npm pack --dry-run

      - name: Pack cosdi-diagnostics
        working-directory: extensions/cosdi-diagnostics
        run: npm pack --dry-run --ignore-scripts

      - name: Pack cosdi-codegen
        working-directory: extensions/cosdi-codegen
        run: npm pack --dry-run --ignore-scripts

      - name: Install cosdi-diagnostics into a scratch project
        run: node scripts/test-diagnostics-install.js

      - name: Install cosdi-codegen into a scratch project
        run: node scripts/test-codegen-install.js

      - name: Validate this project's own dependency injection
        run: node extensions/cosdi-codegen/bin/cosdi-codegen.js validate --project . --strict

      - name: Pack extension zip
        run: node scripts/pack-extension.js
      - name: Check zip
        run: |
          test -f cosdi-diagnostics.zip
          unzip -l cosdi-diagnostics.zip | grep -q package.json
      - uses: actions/upload-artifact@v4
        with:
          name: cosdi-diagnostics.zip
          path: cosdi-diagnostics.zip
